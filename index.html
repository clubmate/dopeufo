<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>DOPE UFO — Tactical</title>
    <!-- Inline SVG icon: browsers request /favicon.ico by default, and that 404
         was the only console error left in an otherwise clean boot. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070A09'/%3E%3Cpath d='M16 5l10 6v10l-10 6-10-6V11z' fill='none' stroke='%23E2A63E' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23E2A63E'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <style>
      /* Base shell only. All HUD styling lives in src/ui/styles.css (ui owner). */
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
      body { font-family: 'Rajdhani', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #app { position: fixed; inset: 0; }
      #view { display: block; width: 100%; height: 100%; }

      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-content: center; gap: 1.5rem; justify-items: center;
        background: radial-gradient(ellipse at 50% 40%, #101826 0%, #05070c 70%);
        transition: opacity .6s ease, visibility .6s;
      }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot h1 {
        font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700; letter-spacing: .35em;
        color: #e8f0ff; text-transform: uppercase; text-indent: .35em;
      }
      #boot .bar { width: min(38vw, 420px); height: 2px; background: #1b2635; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #2c7be5, #63e2ff); transition: width .3s ease; }
      #boot .status { font-size: .8rem; letter-spacing: .2em; color: #5d7290; text-transform: uppercase; min-height: 1em; }
      #fatal {
        position: fixed; inset: 0; z-index: 10000; display: none; place-content: center;
        background: #0a0d14; color: #ff6b6b; font-family: ui-monospace, monospace;
        padding: 2rem; white-space: pre-wrap; overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
    </div>

    <div id="boot">
      <h1>Dope UFO</h1>
      <div class="bar"><i></i></div>
      <div class="status">initialising</div>
    </div>
    <pre id="fatal"></pre>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
