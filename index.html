<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DopeUFO - Turn-Based Tactical Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        
        #game-container {
            display: flex;
            height: 100vh;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
            background: #0f0f1e;
        }
        
        #game-canvas {
            display: block;
            cursor: crosshair;
        }
        
        #ui-panel {
            width: 300px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }
        
        .ui-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #0f3460;
            border-radius: 5px;
        }
        
        .ui-section h2 {
            font-size: 16px;
            color: #00d4ff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .stat-label {
            color: #aaa;
        }
        
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
        
        .action-button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #533483;
            border: none;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            border-radius: 3px;
            transition: background 0.2s;
        }
        
        .action-button:hover:not(:disabled) {
            background: #7b4fb8;
        }
        
        .action-button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        
        .action-button.active {
            background: #00d4ff;
            color: #000;
        }
        
        #turn-indicator {
            padding: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            background: #533483;
            color: #fff;
        }
        
        #message-log {
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .message {
            padding: 3px 0;
            border-bottom: 1px solid #0f0f1e;
        }
        
        .message.combat {
            color: #ff6b6b;
        }
        
        .message.movement {
            color: #4ecdc4;
        }
        
        .message.system {
            color: #ffe66d;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container">
            <canvas id="game-canvas"></canvas>
        </div>
        <div id="ui-panel">
            <div id="turn-indicator">PLAYER TURN</div>
            
            <div class="ui-section">
                <h2>Selected Unit</h2>
                <div id="unit-info">
                    <div class="stat-line">
                        <span class="stat-label">Name:</span>
                        <span class="stat-value" id="unit-name">None</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Action Points:</span>
                        <span class="stat-value" id="unit-ap">-</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Health:</span>
                        <span class="stat-value" id="unit-health">-</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Accuracy:</span>
                        <span class="stat-value" id="unit-accuracy">-</span>
                    </div>
                </div>
            </div>
            
            <div class="ui-section">
                <h2>Actions</h2>
                <button class="action-button" id="btn-move">Move Mode</button>
                <button class="action-button" id="btn-shoot">Shoot Mode</button>
                <button class="action-button" id="btn-end-turn">End Turn</button>
            </div>
            
            <div class="ui-section">
                <h2>Message Log</h2>
                <div id="message-log"></div>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
